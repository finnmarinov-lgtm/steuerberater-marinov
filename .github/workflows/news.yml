name: Steuer-Nachrichten aktualisieren

on:
  schedule:
    - cron: '30 4 * * *'   # täglich 6:30 Uhr deutscher Sommerzeit
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/news.py
      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news.json
          git diff --cached --quiet || (git commit -m "Steuer-Nachrichten aktualisiert" && git push)
